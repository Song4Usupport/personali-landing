<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>תודה | פרסונלי</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#10262F;--ink-soft:#45606A;--teal-deep:#2C5360;--orange:#F29140;--ground:#F4F7F8;--line:#DCE5E8}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;background:var(--ground);color:var(--ink)}
  .card{max-width:520px;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:36px 28px;text-align:center}
  img{height:60px;width:auto;border-radius:10px;margin-bottom:22px}
  h1{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:34px;margin:0 0 10px}
  p{color:var(--ink-soft);font-size:18px;line-height:1.6;margin:0 0 22px}
  a.btn{display:inline-block;font-weight:700;color:#fff;background:var(--orange);text-decoration:none;border-radius:10px;padding:12px 22px}
  a.btn:focus-visible{outline:3px solid var(--teal-deep);outline-offset:2px}
</style>

</head>
<body>
  <main class="card">
    <img src="logo.png" alt="פרסונלי">
    <h1>תודה, הפרטים התקבלו</h1>
    <p>ליאור יחזור אליכם בהקדם לתיאום שיחת היכרות. אם נוח לכם, אפשר גם להתקשר ישירות.</p>
    <a class="btn" href="tel:0528911555">052-8911555</a>
  </main>
</body>
</html>
